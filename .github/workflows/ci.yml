# LuxeStays CI.
#
# Three jobs, ordered by how fast they fail:
#   analyze  - format + static analysis + tests, on every push (~2 min)
#   contract - boots the mock back end and asserts the vendor contracts still
#              parse. This is the job that catches "SynXis changed a field"
#              before it reaches a device.
#   build    - release artefacts, only on main and tags.
#
# Signing secrets are referenced but never printed; the Android keystore and the
# iOS App Store Connect key arrive as base64 secrets and are written to a
# RUNNER_TEMP path that the runner discards.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  FLUTTER_VERSION: "3.35.3"

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      # --fatal-warnings, not --fatal-infos: deprecation hints differ between
      # Flutter minor versions, and a CI that fails because the SDK deprecated a
      # constructor argument last week trains people to ignore it.
      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Unit & widget tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  contract:
    name: Vendor contract check
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Start the mock back end
        run: |
          dart run tool/mock_server/server.dart --port 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done

      # Hits every vendor the app depends on and fails if a response no longer
      # matches the shape the client decodes. Pointed at a real sandbox (SynXis
      # CERT, a Salesforce scratch org, the CMS preview environment) this is the
      # early-warning system for a breaking upstream change.
      - name: Contract smoke
        run: bash tool/contract_check.sh http://localhost:8080

  build:
    name: Build release artefacts
    runs-on: macos-latest
    needs: [analyze, contract]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate platform projects
        run: flutter create --platforms=android,ios --org com.luxestays --project-name luxe_stays .

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          fi

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=FLAVOR=prod \
            --dart-define=API_BASE_URL=${{ vars.PROD_API_BASE_URL }} \
            --dart-define=SYNXIS_BASE_URL=${{ vars.PROD_SYNXIS_BASE_URL }} \
            --dart-define=SALESFORCE_BASE_URL=${{ vars.PROD_SALESFORCE_BASE_URL }} \
            --dart-define=CMS_BASE_URL=${{ vars.PROD_CMS_BASE_URL }} \
            --dart-define=LEONARDO_BASE_URL=${{ vars.PROD_LEONARDO_BASE_URL }} \
            --build-number=${{ github.run_number }}

      - name: Build iOS (no codesign on PR-less runs without secrets)
        run: |
          flutter build ipa --release --no-codesign \
            --dart-define=FLAVOR=prod \
            --build-number=${{ github.run_number }} || \
          flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/bundle/release/*.aab
            build/ios/ipa/*.ipa
          if-no-files-found: warn
