# Pinned demo CI: local contract checks do not certify vendor compatibility.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit & widget tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          plugins: noop
          flags: flutter
          name: luxe-stays
          # Keep tests and downloadable LCOV useful before the repository has
          # been enabled in Codecov. Uploads begin working automatically after
          # the Codecov GitHub App is granted access to this repository.
          fail_ci_if_error: false

  contract:
    name: Local mock contract check
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Start the mock back end
        run: |
          dart run tool/mock_server/server.dart --port 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done

      - name: Contract smoke
        run: bash tool/contract_check.sh http://localhost:8080

  build:
    name: Build unsigned demo artefacts
    runs-on: macos-latest
    needs: [analyze, contract]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Android demo APK
        run: |
          mkdir -p build/demo-apks
          make build-emulator FLUTTER=flutter DART=dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/demo-apks/luxestays-android-emulator.apk
          make build-android-usb FLUTTER=flutter DART=dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/demo-apks/luxestays-android-usb.apk

      - name: Build iOS simulator demo
        run: make build-ios-simulator FLUTTER=flutter DART=dart

      - uses: actions/upload-artifact@v4
        with:
          name: demo-builds
          path: |
            build/demo-apks/*.apk
            build/ios/iphonesimulator/*.app
          if-no-files-found: error
