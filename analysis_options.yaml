include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "build/**"
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # Deliberately NOT enabled:
    #   require_trailing_commas - `dart format` already owns this, and as a lint
    #     it produces hundreds of findings that bury real ones.
    #   comment_references - would require importing a symbol solely to mention
    #     it in a doc comment, which distorts the import graph.
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
